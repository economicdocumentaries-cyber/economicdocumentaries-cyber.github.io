<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Arial, Helvetica, sans-serif">
  <title>Sample medication label: ketorolac tromethamine injection</title>
  <!-- An original sample label for the Practice Exam Center, for practice only.
       The route line sits on its own shape with an id (label-route), so
       hot-spot areas can be checked against it. -->
  <rect width="600" height="260" fill="#FFFFFF"/>
  <rect x="6" y="6" width="588" height="248" rx="10" fill="#FFFFFF" stroke="#4A5A6A" stroke-width="2"/>
  <path d="M7 50 V17 A10 10 0 0 1 17 7 H583 A10 10 0 0 1 593 17 V50 Z" fill="#245E8F"/>
  <g fill="#FFFFFF" font-size="13" font-weight="700">
    <text x="24" y="34">NDC 00000-000-00</text>
    <text x="576" y="34" text-anchor="end">Rx only</text>
  </g>
  <text x="24" y="86" font-size="24" font-weight="700" fill="#173E61">Ketorolac Tromethamine Injection, USP</text>
  <rect x="20" y="102" width="160" height="50" rx="6" fill="#EAF2F9" stroke="#245E8F" stroke-width="2"/>
  <text x="100" y="136" font-size="26" font-weight="700" fill="#173E61" text-anchor="middle">30 mg/mL</text>
  <text x="576" y="134" font-size="18" font-weight="700" fill="#333333" text-anchor="end">1 mL Single-Dose Vial</text>
  <rect id="label-route" x="18" y="160" width="196" height="28" rx="4" fill="#FFFFFF"/>
  <text x="24" y="180" font-size="17" font-weight="700" fill="#173E61">For IV or IM use</text>
  <g fill="#333333" font-size="14">
    <text x="24" y="208">Each mL contains 30 mg of ketorolac tromethamine.</text>
    <text x="24" y="226">Discard unused portion. Protect from light.</text>
  </g>
  <text x="24" y="246" font-size="12" fill="#666666">Lot KT5530 &#160;&#160; Exp 11/2027</text>
  <text x="576" y="246" font-size="12" font-weight="700" fill="#B3261E" text-anchor="end">SAMPLE LABEL FOR PRACTICE ONLY</text>
</svg>
